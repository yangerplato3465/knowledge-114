<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冒險世界 · 班級 RPG</title>
    <link rel="icon" type="image/webp" href="../assets/images/favicon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/class-rpg-game.css">
</head>
<body>
    <div class="game-bar">
        <a href="class-rpg.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> 回班級管理</a>
        <h1>⚔️ 冒險世界</h1>
        <span id="worldCount" class="hint">等待班級名冊</span>
    </div>

    <div class="world-controls">
        <label>班級<select id="worldClass" disabled><option>等待登入…</option></select></label>
        <label>角色名冊<select id="studentFocus" disabled><option>選擇學生</option></select></label>
        <button id="pauseWorld" disabled aria-pressed="false">暫停散步</button>
    </div>
    <p id="worldStatus" role="status">正在準備班級世界…</p>
    <div id="gameContainer">
        <div id="gameLoading" class="game-loading">遊戲載入中…</div>
    </div>

    <div id="characterInfo" role="status">點選角色或使用名冊，查看能力與成長。</div>
    <script type="module" src="../assets/js/class-rpg-game.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>
