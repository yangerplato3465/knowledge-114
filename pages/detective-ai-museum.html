<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偵探事件簿 · AI 展覽館的消失記憶</title>
    <link rel="icon" type="image/webp" href="../assets/images/favicon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 引擎的 Pixi 是從 jsdelivr 動態 import 的，先把連線建好，
         省下驗證通過後才開始做 DNS／TLS 的那段等待 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/detective.css">
</head>
<body>
    <div class="game-bar">
        <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> 回學習主頁</a>
        <h1>🔍 偵探事件簿</h1>
        <div id="groupSwitch" class="group-switch" hidden>
            <button type="button" id="groupBtn" class="group-tag" aria-haspopup="true" aria-expanded="false"
                    title="切換組別"></button>
            <div id="groupMenu" class="group-menu" hidden></div>
        </div>
    </div>

    <div id="gameContainer">
        <div id="gameLoading" class="game-loading">案件卷宗載入中…</div>
    </div>

    <!-- 上課驗證碼門檻。驗證通過前 detective/engine.js 不會被載入，
         所以遮罩後面沒有東西可以偷看（見 detective/gate.js）。 -->
    <div id="gate" class="gate" hidden>
        <div class="gate-card">
            <div class="gate-icon">🔒</div>
            <h2>需要遊戲驗證碼</h2>
            <p class="gate-hint">這個案件只能在課堂上遊玩。<br>請輸入老師當堂提供的驗證碼。</p>

            <div id="gateGroups" class="gate-groups" hidden>
                <p class="gate-groups-title">這台裝置上的組別</p>
                <div id="gateGroupList" class="gate-group-list"></div>
                <button type="button" id="gateForget" class="gate-forget">清除這台記住的組別</button>
                <div class="gate-or">或輸入驗證碼</div>
            </div>

            <input id="gateCode" type="text" autocomplete="off" spellcheck="false"
                   autocapitalize="characters" maxlength="16" placeholder="AIM-XXXX-XX">
            <button type="button" id="gateBtn" class="gate-btn">開啟案件</button>
            <div id="gateErr" class="gate-err" role="alert"></div>
            <a href="../index.html" class="gate-back">← 回學習主頁</a>
        </div>
    </div>

    <!-- id 跟檔名一致（都是 ai-museum），所以這一案沒有黃金貓頭鷹那種
         「檔名 golden-owl 但 id 是 owl」的落差。
         驗證碼的長度由 prefix 決定（AIM-XXXX-XX），跟 id 多長無關。
         ★ 這個字串一旦發過碼就凍結了 —— 它進 PBKDF2 的金鑰，改掉會讓
         已發出的碼全部失效、各組進度再也讀不回來。 -->
    <script>window.DETECTIVE_GAME_ID = 'ai-museum';</script>
    <!-- 案件資料要先於引擎載入（引擎讀取 window.DETECTIVE_CASE） -->
    <script src="../assets/js/detective/cases/ai-museum.js"></script>
    <!-- 引擎（detective/engine.js）改由 gate 在驗證通過後才動態 import -->
    <script type="module" src="../assets/js/detective/gate.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>
