<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <!-- 觸控電視上要禁止雙指縮放，不然學生一碰就把版面拉歪 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>字尾大分流 · -ful / -less</title>
    <link rel="icon" type="image/webp" href="../assets/images/favicon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/word-sort.css">
</head>
<body>

<div class="app">

    <!-- ==========================================================
         開始畫面
         ========================================================== -->
    <section id="screen-start" class="screen screen-start">
        <h1 class="start-title">字尾大分流</h1>

        <div class="start-demo">
            <span class="d-stem">hope</span>
            <span class="d-op">+</span>
            <span class="d-suf">less</span>
            <span class="d-op">=</span>
            <span class="d-out">hopeless</span>
        </div>

        <p class="start-sub">
            看懂意思，幫字根接上正確的 <b>-ful</b> 或 <b>-less</b>！<br>
            每答一題，單字就會進入一個有編號的陣列。
        </p>

        <div id="pool-picker" class="pool-picker"><!-- 由 JS 依題庫產生 --></div>

        <div class="start-foot">
            <a href="../index.html" class="back-link"><i class="fa-solid fa-chevron-left"></i> 回到學習主頁</a>
            <button id="fullscreen-btn" class="ghost-btn" type="button">
                <i class="fa-solid fa-expand"></i> 全螢幕
            </button>
        </div>
    </section>

    <!-- ==========================================================
         遊戲畫面
         ========================================================== -->
    <section id="screen-play" class="screen hidden">

        <header class="topbar">
            <button id="quit-btn" class="quit-btn" type="button">
                <i class="fa-solid fa-chevron-left"></i> 結束
            </button>
            <div class="spacer"></div>
            <div class="stat good"><i class="fa-solid fa-check"></i> <span id="stat-right">0</span></div>
            <div class="stat bad"><i class="fa-solid fa-xmark"></i> <span id="stat-wrong">0</span></div>
            <div class="stat timer" id="stat-timer"><i class="fa-regular fa-clock"></i> <span id="timer-num">--</span></div>
        </header>

        <!-- 陣列 HUD ①：題目佇列。
             答完一題，[0] 會被抽走，後面全部往前遞補而且索引重新編號 ——
             那個重新編號的動畫就是 shift() 最核心的教學點。 -->
        <div class="queue-hud">
            <span class="hud-label">題目排隊中 <b>queue</b></span>
            <div id="queue-chips" class="queue-chips"></div>
            <span class="hud-len">還有 <b id="queue-len">0</b> 個</span>
        </div>

        <!-- 題目卡 -->
        <div class="stage" id="stage">
            <div class="drag-hint left" id="hint-left">-ful</div>
            <div class="drag-hint right" id="hint-right">-less</div>

            <div class="array-action" id="array-action" aria-live="polite">
                <span id="array-action-zh">讀取排在最前面的題目</span>
                <code id="array-action-code">queue[0]</code>
            </div>

            <div class="card" id="card">
                <div class="card-stem-zh" id="card-stem-zh">希望</div>
                <div class="word-line">
                    <span class="w-stem" id="w-stem">hope</span><span class="w-slot" id="w-slot">?</span>
                </div>
                <div class="card-def" id="card-def">絕望的</div>
                <div class="card-note hidden" id="card-note"></div>
            </div>
        </div>

        <!-- 陣列 HUD ②：兩個收集籃，各自就在它那顆按鈕的正上方。
             這不是計數器，是兩個真的陣列 —— 每答一題就有一個新單字
             帶著自己的索引長出來，整局都看得到它們在變長。 -->
        <div class="collected">
            <div class="collected-side ful">
                <span class="coll-name">ful</span>
                <div class="coll-items" id="coll-ful">
                    <span class="coll-empty">[ 還是空的 ]</span>
                </div>
                <span class="coll-len">共 <b id="len-ful-live">0</b> 個</span>
            </div>
            <div class="collected-side less">
                <span class="coll-name">less</span>
                <div class="coll-items" id="coll-less">
                    <span class="coll-empty">[ 還是空的 ]</span>
                </div>
                <span class="coll-len">共 <b id="len-less-live">0</b> 個</span>
            </div>
        </div>

        <!-- 兩個大靶區。點擊是主要操作，拖曳是額外的。 -->
        <div class="zones">
            <button class="zone zone-ful" id="zone-ful" data-suffix="ful" type="button">
                <i class="fa-solid fa-arrow-left arrow"></i>
                <div class="zone-suffix">-ful</div>
                <div class="zone-mean">充滿⋯⋯的</div>
            </button>
            <button class="zone zone-less" id="zone-less" data-suffix="less" type="button">
                <i class="fa-solid fa-arrow-right arrow"></i>
                <div class="zone-suffix">-less</div>
                <div class="zone-mean">沒有⋯⋯的</div>
            </button>
        </div>

    </section>

    <!-- 分類完成後的短版陣列挑戰。這是遊戲流程的一部分，不是結算摘要：
         學生要真的用 index / length 讀取剛才親手建立的陣列。 -->
    <section id="screen-challenge" class="screen screen-challenge hidden">
        <header class="challenge-head">
            <button id="challenge-quit-btn" class="quit-btn" type="button">
                <i class="fa-solid fa-chevron-left"></i> 結束
            </button>
            <span>陣列小挑戰</span>
            <span id="challenge-progress">1 / 3</span>
        </header>

        <div class="challenge-prompt">
            <div id="challenge-zh">找出指定位置的單字</div>
            <code id="challenge-code">fulArray[0]</code>
            <div id="challenge-feedback" class="challenge-feedback" aria-live="polite"></div>
        </div>

        <div class="challenge-arrays" aria-label="剛才完成的兩個陣列">
            <div class="challenge-array ful">
                <span class="challenge-array-name">fulArray</span>
                <div id="challenge-ful" class="challenge-array-items"></div>
            </div>
            <div class="challenge-array less">
                <span class="challenge-array-name">lessArray</span>
                <div id="challenge-less" class="challenge-array-items"></div>
            </div>
        </div>

        <div id="challenge-options" class="challenge-options"></div>
    </section>

    <!-- ==========================================================
         結算畫面
         ------------------------------------------------------
         這裡刻意「不」再展示一次陣列。陣列該在玩的過程中被看見，
         只在結算畫面秀一段程式碼的話，那不叫教、那叫宣布。
         所以這頁只留成績跟答錯的字複習。
         ========================================================== -->
    <section id="screen-result" class="screen screen-result hidden">
        <h2 class="result-title" id="result-title">分完了！</h2>
        <p class="result-score" id="result-score"></p>

        <div class="review-box" id="review-box"></div>

        <div class="result-actions">
            <button class="pill-btn" id="again-btn" type="button">
                <i class="fa-solid fa-rotate-left"></i> 再玩一次
            </button>
            <button class="ghost-btn" id="change-pool-btn" type="button">換一組題目</button>
        </div>

        <a href="../index.html" class="back-link"><i class="fa-solid fa-chevron-left"></i> 回到學習主頁</a>
    </section>

</div>

<!-- 特效層。整張 canvas 不吃事件，Pixi 掛掉也只是沒有粒子。 -->
<canvas id="fx"></canvas>

<!-- 載入順序有意義：
     pools 先定義 WORD_SORT_POOLS，word-sort.js 才讀得到（同 math-rpg 的作法）。
     pixi 與 fx 是選配 —— 這兩行整組刪掉，遊戲仍然完整可玩，只是沒有彩帶。 -->
<script src="../assets/js/word-sort-pools.js"></script>
<script src="../assets/vendor/pixi.min.js"></script>
<script src="../assets/js/word-sort-fx.js"></script>
<script src="../assets/js/word-sort.js"></script>
<script src="../assets/js/theme.js"></script>
</body>
</html>
