name: Deploy to GitHub Pages

on:
  push:
    branches: [main]   # change if your default branch differs
  pull_request:
    branches: [main]
  workflow_dispatch:    # lets you trigger manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check site references and script order
        run: python3 scripts/check_site.py
      - name: Check JavaScript syntax
        run: node scripts/check_js.cjs
      - name: Test shared features
        run: pnpm test
      - name: Build and verify compatible output
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
